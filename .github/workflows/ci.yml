name: shell-contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BE_SHELL_PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/verify_release.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/wheel_smoke.py
      - if: runner.os == 'Linux'
        run: sh scripts/setup.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup.ps1
      - run: git diff --exit-code

  container-build:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - run: docker build -f deployment/Dockerfile -t be-benchmark-shell .
